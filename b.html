<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산지직송 배추주문하기</title>
<meta name="description" content="괴산 절임배추 20kg 45,000원 · 무료배송 · 김장 하루 전날 도착">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sanjijiksong.github.io/b">
<meta property="og:title" content="산지직송 배추주문하기">
<meta property="og:description" content="괴산 절임배추 20kg 45,000원 · 무료배송 · 김장 하루 전날 도착">
<meta property="og:image" content="https://sanjijiksong.github.io/og-b.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf6ef;color:#2b2118;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:20px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:#7a6650;font-size:16px;margin-bottom:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:19px;margin:0 0 10px}
.cat{font-size:19px;font-weight:700;margin:14px 0 2px;padding-top:10px;border-top:2px solid #f0e8dc}
.cat:first-of-type{border-top:none;margin-top:4px;padding-top:0}
.catnote{color:#8a5a2b;font-size:15px}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0e8dc}
.item:last-child{border-bottom:none}
.iname{font-weight:600}
.iprice{color:#8a5a2b;font-size:16px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:10px;border:1px solid #d8c7ad;background:#fff;font-size:24px;color:#6b4423}
.qty span{min-width:28px;text-align:center;font-size:20px;font-weight:700}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=date]{width:100%;height:52px;font-size:18px;padding:0 12px;border:1px solid #d8c7ad;border-radius:10px;background:#fff}
.row{display:flex;gap:8px}
.row input{flex:1}
.btn2.wide{width:100%;height:58px;font-size:20px}
.btn2{height:52px;padding:0 14px;border-radius:10px;border:none;background:#6b4423;color:#fff;font-size:16px;white-space:nowrap}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.check input{width:26px;height:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:44px;padding:0 14px;border-radius:22px;border:1px solid #d8c7ad;background:#fff;font-size:16px}
.chips button.on{background:#6b4423;color:#fff;border-color:#6b4423}
.total{position:sticky;bottom:0;background:#2b2118;color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-top:10px}
.submit{width:100%;height:60px;border:none;border-radius:14px;background:#c0392b;color:#fff;font-size:21px;font-weight:700;margin-top:12px}
.submit:disabled{background:#999}
.err{color:#c0392b;font-weight:600;margin-top:10px;min-height:1em}
#postWrap{display:none;border:1px solid #d8c7ad;height:420px;margin-top:8px;position:relative}
.hide{display:none}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:24px;font-weight:700;margin-bottom:12px}
.acc{background:#fff6e0;border-radius:12px;padding:14px;margin:14px 0;font-size:20px;font-weight:700}
.note{color:#7a6650;font-size:15px}
.arr{background:#eef7ee;border-radius:12px;padding:12px;margin-top:10px;font-size:18px;font-weight:700;color:#256029}
.disc{text-align:right;color:#c0392b;font-weight:700;font-size:17px;margin-top:8px}
</style></head><body><div class="wrap">
<div id="formArea">
<h1 id="title">산지직송 주문서</h1>
<div class="sub" id="subtitle"></div>

<div class="card"><h2>① 상품 고르기</h2>
<div class="note">+ 를 누르면 1상자씩 늘어나요</div>
<div id="items">불러오는 중이에요...</div></div>

<div class="card hide" id="dateCard"><h2 id="dateTitle">📅 받으실 날짜</h2>
<input type="date" id="arrival" onchange="showArrival()">
<div class="note" id="dateNote"></div>
<div class="arr hide" id="arrInfo"></div>
</div>

<div class="card"><h2>② 주문하시는 분</h2>
<label>이름</label><input type="text" id="buyerName" autocomplete="name">
<label>전화번호</label><input type="tel" id="buyerPhone" placeholder="010-1234-5678" autocomplete="tel">
<div class="check"><input type="checkbox" id="isGift" onchange="toggleGift()"><span>선물로 보내요 🎁</span></div>
<div id="giftFields" class="hide">
<label>받으실 분 이름</label><input type="text" id="recvName">
<label>받으실 분 전화번호</label><input type="tel" id="recvPhone" placeholder="010-1234-5678">
</div>
</div>

<div class="card"><h2>③ 받으실 주소</h2>
<button class="btn2 wide" type="button" onclick="findAddr()">🔍 주소 찾기</button>
<div id="postWrap"></div>
<input type="text" id="addr1" placeholder="주소" style="margin-top:8px">
<label>나머지 주소 (동·호수)</label><input type="text" id="addr2" placeholder="예: 101동 303호">
</div>

<div class="card"><h2>어디서 보셨을까요?</h2>
<div class="chips" id="sources"></div>
<div class="check"><input type="checkbox" id="agree" checked><span>제철 소식 문자 받기</span></div>
</div>

<div class="disc hide" id="disc"></div>
<div class="total"><span>합계</span><span id="total">0원</span></div>
<button class="submit" id="submitBtn" onclick="submitForm()">주문하기</button>
<div class="err" id="err"></div>
</div>

<div id="doneArea" class="hide"><div class="card done">
<div class="big">주문 받았습니다 🙏</div>
<div style="font-size:22px">합계 <b id="dAmt"></b></div>
<div id="dArr" style="margin-top:6px"></div>
<div style="margin-top:10px">아래 계좌로 입금해 주세요</div>
<div class="acc" id="dAcc"></div>
<div class="note">문자로도 보내드렸어요.<br>입금하시면 확인 문자 드릴게요.</div>
<div class="note" style="margin-top:10px">주문번호 <span id="dId"></span></div>
</div></div>
</div>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
var PRODUCTS = [];
var CATS = [];
var ITEM = "절임배추";
var API = "https://script.google.com/macros/s/AKfycbzj3kOu7xtu_iqP2yZIvgPAqqVncrkevMTSpU5iaKN74zU8OgJVD71fMkgrL6kCxiDK9A/exec";
var google = { script: { run: (function () {
  var ok = function () {}, fail = function () {}, o = {
    withSuccessHandler: function (f) { ok = f; return o; },
    withFailureHandler: function (f) { fail = f; return o; },
    submitOrder: function (d) {
      fetch(API, { method: "POST", body: JSON.stringify({ action: "order", order: d }) })
        .then(function (r) { return r.json(); })
        .then(function (r) { if (r && r.ok) ok(r); else fail({ message: (r && r.error) || "접수 중 문제가 생겼어요. 전화 주세요." }); })
        .catch(function () { fail({ message: "인터넷 연결을 확인하고 다시 눌러주세요. 계속 안 되면 전화 주세요." }); });
    }
  };
  return o;
})() } };

var qty = {}; var source = "";
var SOURCES = ["유튜브","틱톡","인스타","아는 분 소개","기타"];
function won(n){ return n.toLocaleString("ko-KR") + "원"; }
function catOf(name){ for (var i = 0; i < CATS.length; i++) if (CATS[i].name === name) return CATS[i]; return null; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function renderHead(){
  if (CATS.length === 1) {
    document.getElementById("title").textContent = (CATS[0].icon ? CATS[0].icon + " " : "") + document.getElementById("title").textContent;
    document.getElementById("subtitle").textContent = CATS[0].title + (CATS[0].note ? " · " + CATS[0].note : "");
  } else {
    document.getElementById("subtitle").textContent = CATS.map(function(c){ return (c.icon ? c.icon + " " : "") + c.title; }).join(" · ");
  }
}
function renderItems(){
  var box = document.getElementById("items"); box.innerHTML = "";
  if (!PRODUCTS.length) { box.textContent = "지금은 주문받는 상품이 없어요. 전화 주세요."; return; }
  CATS.forEach(function(c){
    if (CATS.length > 1) {
      var h = document.createElement("div"); h.className = "cat";
      h.textContent = (c.icon ? c.icon + " " : "") + c.title;
      box.appendChild(h);
      if (c.note) { var n = document.createElement("div"); n.className = "catnote"; n.textContent = c.note; box.appendChild(n); }
    }
    PRODUCTS.forEach(function(p, i){
      if (p.cat !== c.name) return;
      var d = document.createElement("div"); d.className = "item";
      d.innerHTML = '<div><div class="iname"></div><div class="iprice"></div></div>' +
        '<div class="qty"><button type="button">−</button><span>0</span><button type="button">+</button></div>';
      d.querySelector(".iname").textContent = p.name;
      d.querySelector(".iprice").textContent = won(p.price);
      var bs = d.querySelectorAll("button"), sp = d.querySelector("span");
      bs[0].onclick = function(){ qty[i] = Math.max(0, (qty[i]||0) - 1); sp.textContent = qty[i]; calc(); };
      bs[1].onclick = function(){ qty[i] = Math.min(50, (qty[i]||0) + 1); sp.textContent = qty[i]; calc(); };
      box.appendChild(d);
    });
  });
}
function renderSources(){
  var box = document.getElementById("sources");
  SOURCES.forEach(function(s){
    var b = document.createElement("button"); b.type = "button"; b.textContent = s;
    b.onclick = function(){ source = s; Array.prototype.forEach.call(box.children, function(x){ x.className = (x === b ? "on" : ""); }); };
    box.appendChild(b);
  });
}
// 도착일이 필요한 품목을 고르면 날짜 칸을 보여줌. 절임배추는 "김장하시는 날"을 고르면 도착일은 하루 전날
function dateDays(){
  var info = null;
  PRODUCTS.forEach(function(p, i){
    var c = catOf(p.cat);
    if (!((qty[i]||0) > 0 && c && c.needDate)) return;
    if (!info) info = { days: 0, offset: 0, ask: c.ask || "받으실 날짜" };
    info.days = Math.max(info.days, c.deadline || 0);
    info.offset = Math.max(info.offset, c.offset || 0);
  });
  return info;
}
var WD = "일월화수목금토";
function md(d){ return (d.getMonth() + 1) + "월 " + d.getDate() + "일(" + WD.charAt(d.getDay()) + ")"; }
function ymdDate(s){ var m = s.split("-"); return new Date(+m[0], +m[1] - 1, +m[2]); }
function showArrival(){
  var info = dateDays(), box = document.getElementById("arrInfo"), val = v("arrival");
  if (!info || !info.offset || !val) { box.className = "arr hide"; return; }
  var d = ymdDate(val); d.setDate(d.getDate() - info.offset);
  box.innerHTML = "배추는 <u>" + md(d) + "</u>에 도착해요<br><span style='font-weight:400;font-size:15px'>김장 " +
    (info.offset === 1 ? "하루" : info.offset + "일") + " 전날 받으시게 보내드려요. 택배는 몇 시에 올지 몰라서요.</span>";
  box.className = "arr";
}
// 품목군마다 상자 수로 할인 (TRN 권장 수량 할인)
function discount(){
  var total = 0;
  CATS.forEach(function(c){
    var n = 0; PRODUCTS.forEach(function(p, i){ if (p.cat === c.name) n += (qty[i]||0); });
    var d = 0; (c.disc || []).forEach(function(t){ if (n >= t[0]) d = t[1]; });
    total += d;
  });
  return total;
}
function calc(){
  var t = 0; PRODUCTS.forEach(function(p, i){ t += p.price * (qty[i]||0); });
  var dc = discount(), db = document.getElementById("disc");
  db.className = dc ? "disc" : "disc hide";
  db.textContent = dc ? "여러 상자 할인 −" + won(dc) : "";
  document.getElementById("total").textContent = won(t - dc);
  var info = dateDays(), card = document.getElementById("dateCard");
  if (!info) { card.className = "card hide"; return; }
  card.className = "card";
  document.getElementById("dateTitle").textContent = "📅 " + info.ask;
  var d = new Date(); d.setDate(d.getDate() + info.days + info.offset);
  var min = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  var inp = document.getElementById("arrival"); inp.min = min;
  if (inp.value && inp.value < min) inp.value = "";
  document.getElementById("dateNote").textContent = md(d) + "부터 고를 수 있어요 (" + (info.days + info.offset) + "일 전까지 주문)";
  showArrival();
}
function toggleGift(){
  document.getElementById("giftFields").className = document.getElementById("isGift").checked ? "" : "hide";
}
function findAddr(){
  var wrap = document.getElementById("postWrap");
  if (!window.daum || !daum.Postcode) { document.getElementById("addr1").focus(); return; }
  wrap.style.display = "block";
  new daum.Postcode({
    oncomplete: function(data){
      document.getElementById("addr1").value = data.roadAddress || data.jibunAddress || data.address;
      wrap.style.display = "none";
      document.getElementById("addr2").focus();
    },
    width: "100%", height: "100%"
  }).embed(wrap);
}
function v(id){ return document.getElementById(id).value.trim(); }
function nums(s){ return s.replace(/[^0-9]/g, ""); }
function submitForm(){
  var err = document.getElementById("err"); err.textContent = "";
  var items = [];
  PRODUCTS.forEach(function(p, i){ if (qty[i] > 0) items.push({ name: p.name, qty: qty[i] }); });
  var gift = document.getElementById("isGift").checked;
  if (!items.length) { err.textContent = "상품을 하나 이상 골라주세요."; return; }
  var di = dateDays();
  if (di && !v("arrival")) { err.textContent = "📅 " + di.ask + " 칸에서 날짜를 골라주세요."; return; }
  if (!v("buyerName") || nums(v("buyerPhone")).length < 10) { err.textContent = "이름과 전화번호를 적어주세요."; return; }
  if (gift && (!v("recvName") || nums(v("recvPhone")).length < 10)) { err.textContent = "받으실 분 이름과 전화번호를 적어주세요."; return; }
  if (!v("addr1")) { err.textContent = "주소 찾기를 눌러 주소를 넣어주세요."; return; }
  var btn = document.getElementById("submitBtn"); btn.disabled = true; btn.textContent = "접수 중...";
  google.script.run
    .withSuccessHandler(function(r){
      document.getElementById("formArea").className = "hide";
      document.getElementById("doneArea").className = "";
      document.getElementById("dId").textContent = r.orderId;
      document.getElementById("dAmt").textContent = won(r.amount);
      document.getElementById("dAcc").textContent = r.account;
      document.getElementById("dArr").textContent = r.arrival ? "도착일: " + r.arrival : "";
      window.scrollTo(0, 0);
    })
    .withFailureHandler(function(e){
      btn.disabled = false; btn.textContent = "주문하기";
      err.textContent = (e && e.message) ? e.message : "접수 중 문제가 생겼어요. 전화 주세요.";
    })
    .submitOrder({
      buyerName: v("buyerName"), buyerPhone: v("buyerPhone"), isGift: gift,
      recvName: v("recvName"), recvPhone: v("recvPhone"), addr1: v("addr1"), addr2: v("addr2"),
      memo: "", depositor: "", source: source, picked: di ? v("arrival") : "",
      agree: document.getElementById("agree").checked, items: items
    });
}
renderSources();
fetch(API + "?api=catalog&item=" + encodeURIComponent(ITEM))
  .then(function (r) { return r.json(); })
  .then(function (d) { PRODUCTS = d.products || []; CATS = d.cats || []; renderHead(); renderItems(); calc(); })
  .catch(function () { document.getElementById("items").textContent = "상품을 불러오지 못했어요. 잠시 후 다시 열어 주시거나 전화 주세요."; });
</script></body></html>
